stages:
  - validate
  - plan
  - compliance
  - apply

variables:
  TF_ROOT: "."
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

terraform:validate:
  image: hashicorp/terraform:1.6.6
  stage: validate
  script:
    - cd "$TF_ROOT"
    - terraform init -backend=false
    - terraform fmt -check -diff
    - terraform validate

terraform:plan:
  image: hashicorp/terraform:1.6.6
  stage: plan
  needs:
    - terraform:validate
  script:
    - cd "$TF_ROOT"
    - terraform init
    - terraform plan -out tfplan.binary
    - terraform show -json tfplan.binary > tfplan.json
  artifacts:
    paths:
      - $TF_ROOT/tfplan.binary
      - $TF_ROOT/tfplan.json

terraform:compliance:
  image: python:3.11-alpine
  stage: compliance
  needs:
    - terraform:plan
  script:
    - pip install --no-cache-dir terraform-compliance
    - terraform-compliance -p "$TF_ROOT/tfplan.json" -f "$TF_ROOT/features"

terraform:apply:
  image: hashicorp/terraform:1.6.6
  stage: apply
  needs:
    - terraform:compliance
  when: manual
  script:
    - cd "$TF_ROOT"
    - terraform apply -auto-approve tfplan.binary
